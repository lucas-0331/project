openapi: 3.0.0
info:
  title: Vapor
  version: 1.0.0
  description: Uma API para gerenciar jogos, documentada em um arquivo YAML.
servers:
  - url: http://localhost:3000/api
tags:
  - name: Usuários
    description: Operações relacionadas a usuários
  - name: Listas
    description: Operações relacionadas a listas

paths:
  /users:
    get:
      summary: Retorna a lista de todos os usuários.
      tags:
        - Usuários
      responses:
        '200':
          description: Uma lista de objetos de usuário.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'

  /users/store:
    post:
      summary: Cria um novo usuário.
      tags:
        - Usuários
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserData'
      responses:
        '201':
          description: Usuário criado com sucesso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Usuário cadastrado com sucesso!
        '400':
          description: Dados inválidos fornecidos.

  /lists:
    get:
      summary: Retorna todas as listas do usuário.
      tags:
        - Listas
      responses:
        '200':
          description: Listas retornadas com sucesso.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/List'

    post:
      summary: Cria uma nova lista.
      tags:
        - Listas
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListInput'
      responses:
        '201':
          description: Lista criada com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List'

  /lists/{id}:
    get:
      summary: Retorna uma lista pelo ID.
      tags:
        - Listas
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Lista encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List'
        '404':
          description: Lista não encontrada.

    put:
      summary: Atualiza uma lista existente.
      tags:
        - Listas
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListInput'
      responses:
        '200':
          description: Lista atualizada com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List'
        '404':
          description: Lista não encontrada.

    delete:
      summary: Deleta uma lista.
      tags:
        - Listas
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Lista deletada com sucesso.
        '404':
          description: Lista não encontrada.

components:
  schemas:
    UserData:
      type: object
      properties:
        nick_name:
          type: string
          example: ArtDent
        first_name:
          type: string
          example: Artur
        last_name:
          type: string
          example: Dent
        email:
          type: string
          example: artur@dent.com
        birth_date:
          type: string
          format: date-time
          example: "1998-03-31T03:00:00.000Z"

    UserResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/UserData'

    List:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        name:
          type: string
        icon:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ListInput:
      type: object
      properties:
        name:
          type: string
        icon:
          type: string
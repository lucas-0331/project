openapi: 3.0.0
info:
  title: Vapor
  version: 1.0.0
  description: Uma API para gerenciar jogos, documentada em um arquivo YAML.
servers:
  - url: https://vapor-73xs.onrender.com/api
    description: Servidor de Produção
  - url: http://localhost:3000/api
    description: Servidor Local
tags:
  - name: Autenticação
    description: Operações de login para obter o token de acesso.
  - name: Usuários
    description: Operações relacionadas a usuários.
  - name: Jogos
    description: Operações relacionadas a jogos.
  - name: Listas
    description: Operações relacionadas às listas personalizadas de cada usuário.
  - name: Listas de Jogos
    description: Operações relacionadas à associação de jogos às listas personalizadas dos usuários.
  - name: Conquistas
    description: Operações relacionadas às conquistas.

paths:
  /auth/login:
    post:
      summary: Autentica o usuário e retorna um token JWT.
      tags:
        - Autenticação
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginData'
      responses:
        '200':
          description: Autenticação bem-sucedida. Retorna o token JWT.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: Token de autenticação JWT.
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        '401':
          description: Credenciais inválidas (e-mail ou senha incorretos).
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Credenciais inválidas.

  /users:
    get:
      summary: Retorna a lista de usuários. Requer token de administrador.
      tags:
        - Usuários
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Uma lista de objetos de usuário.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Acesso negado. Token não fornecido.
        '403':
          description: Acesso proibido. Você não tem permissão de administrador ou token inválido.

  /users/register:
    post:
      summary: Cria um novo usuário.
      tags:
        - Usuários
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserData'
      responses:
        '201':
          description: Usuário criado com sucesso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Usuário cadastrado com sucesso!
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          description: Dados inválidos fornecidos (campos obrigatórios ausentes).
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Todos os campos são obrigatórios.
        '409':
          description: E-mail já em uso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: O e-mail informado já está em uso.

  /games:
    get:
      summary: Retorna a lista de jogos, com paginação por cursor, ordenação e busca por nome.
      tags:
        - Jogos
      security:
        - BearerAuth: [ ]
      parameters:
        - name: cursor
          in: query
          required: false
          description: O ID do último jogo da página anterior. Usado para buscar a próxima página (exceto quando 'search' está ativo).
          schema:
            type: integer
            format: int32
            example: 8427
        - name: sortBy
          in: query
          required: false
          description: A coluna pela qual ordenar os resultados. Padrão é 'id'.
          schema:
            type: string
            enum: [ id, appId, name, created_at, updated_at ]
            default: id
        - name: setOrder
          in: query
          required: false
          description: A ordem da classificação ('asc' ou 'desc'). Padrão é 'asc'.
          schema:
            type: string
            enum: [ asc, desc ]
            default: asc
        - name: search
          in: query
          required: false
          description: Termo de busca (parcial e insensível a maiúsculas/minúsculas) para filtrar jogos por nome. Se presente, a paginação por cursor é ignorada e a busca é limitada a 30 resultados.
          schema:
            type: string
            example: Red Faction

      responses:
        '200':
          description: Uma lista de jogos (apps) paginada e o cursor para a próxima página.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedGamesResponse'
        '401':
          description: Acesso negado. Token não fornecido.
        '403':
          description: Token inválido ou expirado.
        '500':
          description: Erro interno do servidor ao processar a requisição.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Não foi possível retornar a lista de jogos.

  /games/{appId}/details:
    get:
      summary: Retorna detalhes completos de um jogo (via Steam API).
      description: >
        Busca informações detalhadas de um jogo específico utilizando o ID da Steam (appId).
        Os dados são obtidos diretamente da API pública da Steam e formatados.
      tags:
        - Jogos
      security:
        - BearerAuth: []
      parameters:
        - name: appId
          in: path
          required: true
          description: O ID do aplicativo na Steam (Steam App ID).
          schema:
            type: integer
            example: 35450
      responses:
        '200':
          description: Detalhes do jogo retornados com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameDetails'
        '401':
          description: Acesso negado. Token não fornecido ou inválido.
        '500':
          description: Erro ao buscar detalhes na API externa.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Erro interno do servidor.

  /lists:
    get:
      summary: Retorna todas as listas pertencentes ao usuário autenticado.
      tags:
        - Listas
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Retorna um array contendo todas as listas do usuário.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListsResponse'
        '500':
          description: Erro interno do servidor ao buscar as listas.

    post:
      summary: Cria uma nova lista para o usuário autenticado.
      tags:
        - Listas
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListData'
      responses:
        '201':
          description: Lista criada com sucesso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Lista criada com sucesso!
                  data:
                    $ref: '#/components/schemas/List'
        '400':
          description: Campos obrigatórios ausentes.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Todos os campos são obrigatórios.
        '500':
          description: Erro interno ao criar a lista.

  /lists/{id}:
    put:
      summary: Atualiza uma lista existente pertencente ao usuário autenticado.
      tags:
        - Listas
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID da lista a ser atualizada.
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListData'
      responses:
        '200':
          description: Lista atualizada com sucesso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Lista atualizada com sucesso!
                  data:
                    $ref: '#/components/schemas/List'
        '400':
          description: Campos obrigatórios ausentes.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Todos os campos são obrigatórios.
        '500':
          description: Erro interno ao atualizar a lista.

    delete:
      summary: Exclui uma lista pertencente ao usuário autenticado.
      tags:
        - Listas
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID da lista a ser excluída.
          schema:
            type: integer
      responses:
        '200':
          description: Lista deletada com sucesso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Lista deletada com sucesso!
        '500':
          description: Erro interno ao deletar a lista.

  /games-lists/{id}:
    get:
      summary: Retorna todos os jogos pertencentes a uma lista específica do usuário autenticado.
      description: >
        Recupera todos os jogos de uma lista específica (`id`) pertencente ao usuário autenticado.
        Suporta paginação baseada em cursor, busca por nome e ordenação por campos da tabela intermediária (`listsGames`) ou da tabela de jogos (`games`).
      tags:
        - Listas de Jogos
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID da lista a ser consultada.
          schema:
            type: integer
            example: 1
        - name: cursor
          in: query
          required: false
          description: O ID do último item retornado. Usado para paginação (ignorado se 'search' estiver ativo).
          schema:
            type: integer
            example: 123
        - name: sortBy
          in: query
          required: false
          description: "Campo de ordenação (padrão: `id`)."
          schema:
            type: string
            enum: [id (ListsGames), game_id (ListsGames), created_at (ListsGames), appId (Games), name (Games)]
            default: id
        - name: setOrder
          in: query
          required: false
          description: "Direção da ordenação (`asc` ou `desc`). Padrão: `asc`."
          schema:
            type: string
            enum: [asc, desc]
            default: asc
        - name: search
          in: query
          required: false
          description: "Filtro parcial (case-insensitive) aplicado ao nome do jogo."
          schema:
            type: string
            example: counter-strike
      responses:
        '200':
          description: Jogos encontrados na lista.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListsGamesResponse'
        '404':
          description: Lista não encontrada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Lista não encontrada.
        '500':
          description: Erro interno do servidor.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Não foi possível buscar os jogos da lista.

    post:
      summary: Adiciona múltiplos jogos a uma lista específica.
      tags:
        - Listas de Jogos
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID da lista à qual os jogos serão adicionados.
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - gameIds
              properties:
                gameIds:
                  type: array
                  items:
                    type: integer
                    example: 35450
                  description: IDs dos jogos que serão adicionados à lista.
      responses:
        '200':
          description: Jogos adicionados com sucesso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Jogos adicionados à lista com sucesso!
        '400':
          description: Array de IDs ausente ou inválido.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: É necessário informar um array com os IDs dos jogos!
        '404':
          description: Lista não encontrada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Lista não encontrada.
        '500':
          description: Erro interno ao adicionar jogos.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Não foi possível adicionar os jogos à lista.

    delete:
      summary: Remove múltiplos jogos de uma lista específica.
      tags:
        - Listas de Jogos
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID da lista da qual os jogos serão removidos.
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - gameIds
              properties:
                gameIds:
                  type: array
                  items:
                    type: integer
                    example: 8723
                  description: IDs dos jogos que serão removidos da lista.
      responses:
        '200':
          description: Jogos removidos com sucesso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Jogos removidos da lista com sucesso!
        '400':
          description: Array de IDs ausente ou inválido.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: É necessário informar um array com os IDs dos jogos!
        '404':
          description: Lista não encontrada ou nenhum jogo correspondente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Nenhum dos jogos informados foi encontrado na lista.
        '500':
          description: Erro interno ao remover jogos.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Não foi possível remover os jogos da lista.
  
  /achievements/{id}:
    get:
      tags:
        - Conquistas
      summary: Retorna todas as conquistas de um jogo e as conquistas concluídas pelo usuário.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID do jogo.
          schema:
            type: integer
      responses:
        '200':
          description: Lista de conquistas e IDs das conquistas concluídas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AchievementsResponse'
        '404':
          description: Jogo ou conquistas não encontradas.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Nenhuma conquista encontrada para este jogo.
        '500':
          description: Erro ao buscar conquistas.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Não foi possível buscar as conquistas.

    post:
      tags:
        - Conquistas
      summary: Adiciona conquistas concluídas para o usuário autenticado.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID do jogo.
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AchievementsData'
      responses:
        '200':
          description: Conquistas adicionadas com sucesso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Conquistas concluídas salvas com sucesso!
        '400':
          description: Body inválido.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: É necessário informar um array com os IDs das conquistas!
        '404':
          description: Jogo não encontrado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Jogo não encontrado.
        '500':
          description: Erro ao salvar conquistas.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Não foi possível salvar as conquistas concluídas.

    delete:
      tags:
        - Conquistas
      summary: Remove conquistas concluídas para o usuário autenticado.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID do jogo.
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AchievementsData'
      responses:
        '200':
          description: Conquistas removidas com sucesso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Conquistas concluídas removidas com sucesso!
        '400':
          description: Body inválido.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: É necessário informar um array com os IDs das conquistas!
        '404':
          description: Nenhum jogo encontrado ou nenhum item encontrado para remoção.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Nenhuma das conquistas informadas foi encontrada.
        '500':
          description: Erro ao remover conquistas.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Não foi possível remover as conquistas concluídas.

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Insira o token JWT no formato `Bearer <token>`

  schemas:
    LoginData:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: artur@dent.com
        password:
          type: string
          format: password
          example: senha_segura123

    UserData:
      type: object
      required:
        - nick_name
        - first_name
        - last_name
        - email
        - password
        - birth_date
      properties:
        nick_name:
          type: string
          example: ArtDent
        first_name:
          type: string
          example: Artur
        last_name:
          type: string
          example: Dent
        email:
          type: string
          format: email
          example: artur@dent.com
        password:
          type: string
          format: password
          description: A senha do usuário.
          example: senha_segura123
        birth_date:
          type: string
          format: date-time
          example: "1998-03-31T03:00:00.000Z"

    User:
      type: object
      properties:
        nick_name:
          type: string
          example: ArtDent
        first_name:
          type: string
          example: Artur
        last_name:
          type: string
          example: Dent
        email:
          type: string
          format: email
          example: artur@dent.com
        birth_date:
          type: string
          format: date-time
          example: "1998-03-31T03:00:00.000Z"
        role:
          type: string
          enum: [USER, ADMIN]
          example: USER

    UserResponse:
      type: object
      properties:
        data:
          type: object
          description: O controlador retorna o resultado de 'findFirst', que é um único objeto.
          $ref: '#/components/schemas/User'

    Game:
      type: object
      description: Representação de um jogo retornado pelo banco de dados.
      properties:
        id:
          type: integer
          example: 461
          description: ID interno do jogo no banco de dados.
        appId:
          type: integer
          example: 35450
          description: ID do aplicativo na Steam.
        name:
          type: string
          example: 'Red Orchestra 2: Heroes of Stalingrad with Rising Storm'
        headerImageUrl:
          type: string
          format: url
          example: https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/35450/header.jpg?t=1552425243
        capsuleImageUrl:
          type: string
          format: url
          example: https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/35450/capsule_231x87.jpg?t=1552425243
        created_at:
          type: string
          format: date-time
          example: "2025-10-18T03:38:33.502Z"
        updated_at:
          type: string
          format: date-time
          example: "2025-10-18T03:38:33.502Z"

    GameDetails:
      type: object
      description: Detalhes completos do jogo retornados pela rota de detalhes.
      properties:
        app_id:
          type: integer
          example: 35450
        name:
          type: string
          example: "Red Orchestra 2: Heroes of Stalingrad with Rising Storm"
        detailed_description:
          type: string
          description: Descrição completa em formato HTML.
        about_the_game:
          type: string
          description: Resumo sobre o jogo em formato HTML.
        supported_languages:
          type: string
          description: String HTML contendo os idiomas suportados.
        header_image:
          type: string
          format: url
          example: "https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/35450/header.jpg"
        pc_requirements:
          type: object
          description: Objeto contendo requisitos mínimos e recomendados.
        developers:
          type: array
          items:
            type: string
          example: ["Tripwire Interactive"]
        publishers:
          type: array
          items:
            type: string
          example: ["Tripwire Interactive"]
        price:
          type: string
          description: Preço formatado vindo da Steam.
          example: "R$ 49,99"
        platforms:
          type: object
          properties:
            windows:
              type: boolean
            mac:
              type: boolean
            linux:
              type: boolean
        categories:
          type: array
          items:
            type: string
          example: ["Um jogador", "Multijogador", "Coop"]
        genres:
          type: array
          items:
            type: string
          example: ["Ação", "RPG"]
        screenshots:
          type: array
          description: Lista de URLs das capturas de tela.
          items:
            type: string
            format: url
        movies:
          type: array
          description: Lista de URLs de vídeo (HLS).
          items:
            type: string
            format: url
        release_date:
          type: object
          properties:
            coming_soon:
              type: boolean
            date:
              type: string
              example: "13 set. 2011"
        background:
          type: string
          format: url
          example: "https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/35450/page_bg_generated_v6b.jpg"

    PaginatedGamesResponse:
      type: object
      description: Resposta padrão para a listagem paginada de jogos.
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Game'
        cursor:
          type: integer
          nullable: true
          description: O ID do último item retornado. Deve ser usado como 'cursor' na próxima requisição. Será 'null' se a página estiver vazia.
          example: 8427

    List:
      type: object
      properties:
        id:
          type: integer
          example: 1
        user_id:
          type: integer
          example: 42
        name:
          type: string
          example: Favoritos
        icon:
          type: string
          example: 🎮
        color:
          type: string
          example: "#1E90FF"

    ListData:
      type: object
      required:
        - name
        - icon
        - color
      properties:
        name:
          type: string
          example: Meus Jogos
        icon:
          type: string
          example: 🎯
        color:
          type: string
          example: "#FF5733"

    ListsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/List'

    ListsGamesResponse:
      type: object
      description: Retorna os jogos de uma lista específica do usuário autenticado.
      properties:
        data:
          type: array
          description: Lista dos jogos contidos na lista selecionada.
          items:
            allOf:
              - $ref: '#/components/schemas/Game'
              - type: object
                properties:
                  added_in_list_at:
                    type: string
                    format: date-time
                    example: "2025-10-25T14:28:43.000Z"
                  list_game_id:
                    type: integer
                    example: 147
        cursor:
          type: integer
          nullable: true
          description: Cursor para a próxima página (retornado apenas quando não há busca ativa).
          example: 247

    Achievement:
      type: object
      properties:
        id:
          type: integer
          example: 25
        game_id:
          type: integer
          example: 27
        name:
          type: string
          example: Encantado
        description:
          type: string
          nullable: true
          example: Coloque um Encantamento na sua armadura
        image:
          type: string
          nullable: true
          example: https://cdn.fastly.steamstatic.com/steamcommunity/public/images/apps/1593500/a7aed870f8f91f9d1f5947eea55da0d6d40a18c7.jpg

    AchievementsData:
      type: object
      required:
        - achievementsIds
      properties:
        achievementsIds:
          type: array
          items:
            type: integer
            example: 25

    AchievementsResponse:
      type: object
      properties:
        achievementsList:
          type: array
          items:
            $ref: '#/components/schemas/Achievement'
        completedAchievementsIds:
          type: array
          items:
            type: integer
            example: 25